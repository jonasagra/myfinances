<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>myfinances</title>
  <defs>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.55" stop-color="#10B981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- coin body -->
  <circle cx="256" cy="256" r="240" fill="url(#rim)"/>
  <circle cx="256" cy="256" r="212" fill="url(#coin)"/>
  <circle cx="256" cy="256" r="186" fill="none" stroke="#ECFDF5" stroke-opacity="0.55" stroke-width="6"/>
  <circle cx="256" cy="256" r="212" fill="url(#shine)"/>
  <!-- dollar sign -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 104 V408" stroke-width="30"/>
    <path d="M330 178 C312 152 286 142 256 142 C214 142 184 166 184 202 C184 244 220 256 256 264 C298 273 334 288 334 330 C334 368 300 392 256 392 C220 392 192 378 172 350" stroke-width="44"/>
